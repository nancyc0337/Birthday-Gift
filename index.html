<!DOCTYPE html>
<html>
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="assets/partying_face_animated.png" />
  <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* CSS */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }
  </style>
  <title>Happy Birthday</title>
</head>
<body>
  <!-- HTML -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <script>
    // JS
    let birdieHit = false;
    let birdieY = 310;
    let birdieX = 340;
    let currentLanguage = 'none';
    let currentScreen = 0;

    function setup() {
      let cnv = createCanvas(1400, 600);
      cnv.elt.style.border = '10px solid darkgray';
      cnv.elt.style.borderRadius = '20px';
    }

    function draw() {
      if (currentScreen === 0) {
          background(240);
          textFont('Iansui');
          textStyle(BOLD);
          fill(0);
          textSize(90);
          text("Press '1' or '2'.", 350, 350);
      }

      else if (currentScreen === 1) {
          background(240);
          let lx = width / 2;
          let ly = 520;
          let laptopW = 1000;
          let laptopH = 430;

          fill(140);
          stroke(100);
          strokeWeight(2);
          rectMode(CENTER);
          rect(lx, ly - (laptopH / 2 + 10), laptopW, laptopH);

          fill(255);
          noStroke();
          rect(lx, ly - (laptopH / 2 + 10), laptopW - 20, laptopH - 20, 6, 6, 0, 0);

          fill(0);
          stroke(60);
          strokeWeight(1);
          ellipse(lx, ly - laptopH - 4, 6, 6);
          fill(0, 100, 255);
          noStroke();
          ellipse(lx, ly - laptopH - 4, 2, 2);

          fill(70);
          stroke(50);
          rectMode(CENTER);
          rect(lx, ly + 3.5, laptopW * 0.48, 26);

          fill(140);
          stroke(50);
          rectMode(CENTER);
          rect(700, 550, 1000, 25, 5, 5, 5, 5);

          fill("#000000");
          textSize(50);
          text("Press 'E' or 'C' or 'S'.", 450, 55);

          if (currentLanguage === 'english') {
            fill("#000000");
            textSize(50);
            text("🎉Happy Birthday!🎉", 460, 300);
          } else if (currentLanguage === 'chinese') {
            fill("#000000");
            textSize(50);
            text("🎉生日快乐!🎉", 530, 300);
          } else if (currentLanguage === 'spanish') {
            fill("#000000");
            textSize(50);
            text("🎉¡Feliz cumpleaños!🎉", 430, 300);
          }
          rectMode(CORNER);
      }

      else if (currentScreen === 2) {
          background(240);

          push();
          translate(120, 112);
          scale(1.5);

          let x = 90;
          let y = 229;

          stroke(220, 160, 160);
          strokeWeight(4);
          noFill();
          bezier(x - 50, y + 40, x - 90, y + 60, x - 80, y + 20, x - 100, y + 30);

          noStroke();
          fill(130);
          ellipse(x, y + 20, 110, 80);

          ellipse(x + 50, y - 10, 70, 50);

          fill(240, 180, 180);
          ellipse(x + 85, y - 10, 12, 12);

          fill(130);
          ellipse(x + 35, y - 35, 30, 35);
          fill(240, 180, 180);
          ellipse(x + 35, y - 35, 20, 25);

          fill(0);
          ellipse(x + 65, y - 15, 6, 6);

          fill(240, 180, 180);
          ellipse(x - 30, y + 58, 25, 12);
          ellipse(x + 20, y + 58, 25, 12);

          fill(110);
          ellipse(x + 45, y + 25, 25, 15);

          push();
          translate(x + 50, y + 25);
          rotate(radians(-30));

          stroke(50);
          strokeWeight(3);
          line(0, 30, 0, -60);

          stroke(255, 215, 0);
          strokeWeight(5);
          line(0, 15, 0, 35);

          noFill();
          stroke(200, 50, 50);
          strokeWeight(4);
          ellipse(0, -95, 50, 70);

          stroke(255, 150);
          strokeWeight(1);

          line(-15, -115, -15, -75);
          line(-7, -125, -7, -65);
          line(0, -130, 0, -60);
          line(7, -125, 7, -65);
          line(15, -115, 15, -75);

          line(-18, -110, 18, -110);
          line(-23, -100, 23, -100);
          line(-25, -90, 25, -90);
          line(-23, -80, 23, -80);
          line(-18, -70, 18, -70);
          pop();

          pop();

          push();

          if (birdieHit) {
            birdieX += 8;
            birdieY -= 6;
          }
          translate(birdieX, birdieY);
          rotate(radians(-45));

          fill(255, 255, 255, 180);
          stroke(180);
          strokeWeight(1.5);
          quad(-6, -10, 6, -10, 18, -35, -18, -35);

          line(-3, -10, -10, -35);
          line(0, -10, 0, -35);
          line(3, -10, 10, -35);

          fill(255);
          noStroke();
          arc(0, -5, 16, 16, 0, PI, CHORD);

          fill(200, 50, 50);
          rectMode(CENTER);
          rect(0, -7, 16, 4);
          pop();

          fill("#8AFF97");
          noStroke();
          rect(0, 550, 1400, 50);

          textFont('Iansui');
          textStyle(BOLD);
          fill("#000000");
          textSize(32);

          if (!birdieHit) {
              text("Click the birdie.", 550, 585);
          }
          else {
              text("Press 'E', 'C', or 'S'.", 500, 585);

              if (currentLanguage === "english") {
                  textFont('Iansui');
                  textStyle(BOLD);
                  fill("#000000");
                  textSize(50);
                  text("🎉Happy Birthday!🎉", 450, 100);
              }
              else if (currentLanguage === "chinese") {
                  textFont('Iansui');
                  textStyle(BOLD);
                  fill("#000000");
                  textSize(50);
                  text("🎉生日快乐!🎉", 550, 100);
              }
              else if (currentLanguage === "spanish") {
                  textFont('Iansui');
                  textStyle(BOLD);
                  fill("#000000");
                  textSize(50);
                  text("🎉¡Feliz cumpleaños!🎉", 425, 100);
              }
          }
      }
    }

    function mousePressed() {
        if (currentScreen === 2) {
            let d = dist(mouseX, mouseY, birdieX, birdieY);
            if (d < 40) {
                birdieHit = true;
            }
        }
    }

    function keyPressed() {
      if (key === '1') {
          currentScreen = 1;
      }
      else if (key === '2') {
          currentScreen = 2;
      }

      else if (key === 'e' || key === 'E') {
          currentLanguage = "english";
      }
      else if (key === 'c' || key === 'C') {
          currentLanguage = "chinese";
      }
      else if (key === 's' || key === 'S') {
          currentLanguage = "spanish";
      }
    }
  </script>
</body>
</html>
